<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151238">
<title>막 넘고 닭 넘어 · 춘천 닭갈비 막국수 축제</title>
<link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="줄넘기 게임 화면"></canvas>

  <div class="hud-btns">
    <button id="muteBtn" class="icon-btn" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">🔊</button>
    <button id="pauseBtn" class="icon-btn hidden" title="일시정지" aria-label="일시정지">❚❚</button>
  </div>

  <!-- 시작 화면 -->
  <section id="title" class="overlay show">
    <div class="panel">
      <a class="back-link" href="../../index.html">◀ 막닭.ZIP</a>
      <p class="eyebrow">춘천 닭갈비·막국수 축제 · 미니게임 1</p>
      <h1>막 넘고 <em>닭</em> 넘어</h1>
      <p class="sub">막국수 면발로 하는 줄넘기</p>

      <div class="cast">
        <figure>
          <div class="art" style="--img:url(../../cards/01.png)"></div>
          <figcaption>철판대장 닭갈비<b>줄 돌리기</b></figcaption>
        </figure>
        <figure class="me">
          <div class="art" style="--img:url(../../cards/07.png)"></div>
          <figcaption>축제 사장님<b>점프!</b></figcaption>
        </figure>
        <figure>
          <div class="art" style="--img:url(../../cards/02.png)"></div>
          <figcaption>메밀 막국수<b>줄 돌리기</b></figcaption>
        </figure>
      </div>

      <ul class="howto">
        <li><span class="k">탭</span><span>면발이 바닥에 닿기 직전에 화면을 탭!</span></li>
        <li><span class="k">10</span><span>10번 넘을 때마다 점점 빨라져요</span></li>
        <li><span class="k red">길게</span><span>50번부터 <b>빨간 면발</b>이 오면 길게 눌러 2단 뛰기</span></li>
      </ul>

      <button id="startBtn" class="btn primary">시작하기</button>
      <p class="best">최고 기록 <b id="bestTitle">0</b>회 · <span id="starsTitle">☆☆☆</span></p>
    </div>
  </section>

  <!-- 일시정지 -->
  <section id="pause" class="overlay">
    <div class="panel small">
      <h2>잠깐 쉬는 중</h2>
      <p class="sub">면발이 멈춰 있어요</p>
      <button id="resumeBtn" class="btn primary">계속하기</button>
      <button id="quitBtn" class="btn ghost">그만하기</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="overlay">
    <div class="panel">
      <a class="back-link" href="../../index.html">◀ 막닭.ZIP</a>
      <p class="eyebrow">결과</p>
      <div class="big"><span id="resJumps">0</span><small>회</small></div>
      <div class="stars" id="resStars"><i>★</i><i>★</i><i>★</i></div>
      <p class="goal">★ 10회 · ★★ 30회 · ★★★ 60회</p>
      <div id="newBest" class="newbest hidden">NEW 최고 기록!</div>
      <dl class="stats">
        <div><dt>점수</dt><dd id="resScore">0</dd></div>
        <div><dt>Perfect</dt><dd id="resPerfect">0</dd></div>
        <div><dt>최대 연속</dt><dd id="resStreak">0</dd></div>
        <div><dt>최고 기록</dt><dd id="resBest">0</dd></div>
      </dl>
      <div class="boss">
        <div class="art" style="--img:url(../../cards/07.png)"></div>
        <p class="bubble" id="resLine"></p>
      </div>
      <div class="row">
        <button id="homeBtn" class="btn ghost">처음으로</button>
        <button id="retryBtn" class="btn primary">다시 하기</button>
      </div>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
