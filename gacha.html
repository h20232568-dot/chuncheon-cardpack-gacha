<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>축제 카드팩 · 막닭.ZIP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="icon-btn home-link" href="index.html" title="막닭.ZIP 목록으로" aria-label="막닭.ZIP 목록으로">◀</a>
    <div class="logo"><b>닭갈비·막국수</b> 카드팩</div>
    <div class="wallet" title="축제 코인"><span class="coin-ico">₩</span><span id="coins">0</span></div>
    <button id="soundBtn" class="icon-btn" title="소리 켜기/끄기">🔊</button>
  </header>

  <main>
    <section id="shop" class="screen active">
      <p class="shop-guide">개봉할 팩을 골라 주세요</p>
      <div class="pack-select" id="packSelect"></div>
      <div class="pack-info" id="packInfo"></div>
      <div class="shop-actions">
        <button id="openBtn" class="btn primary">팩 개봉하기 <small id="costLabel"></small></button>
        <button id="allowanceBtn" class="btn ghost hidden">사장님께 용돈 받기 (+500)</button>
      </div>
      <div class="pity">
        <div class="pity-label"><span>✦ 특별 카드 천장</span><span id="pityText"></span></div>
        <div class="pity-bar"><i id="pityFill"></i></div>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section id="collection" class="screen">
      <div class="col-head">
        <h2>카드 도감</h2>
        <span id="colProgress"></span>
      </div>
      <div class="col-bar"><i id="colFill"></i></div>
      <div class="col-grid" id="colGrid"></div>
      <button id="resetBtn" class="link-btn">기록 초기화</button>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="shop" class="active"><span>🎴</span>팩 열기</button>
    <button data-tab="collection"><span>📖</span>도감</button>
    <button id="ratesBtn"><span>📊</span>확률 정보</button>
  </nav>
</div>

<!-- 개봉 무대 -->
<div id="stage" class="stage hidden">
  <div class="stage-bg"></div>
  <div class="rays"></div>
  <div class="stage-pack" id="stagePack"></div>
  <div class="card-stack" id="cardStack"></div>
  <div class="counter" id="counter"></div>
  <div class="hint" id="stageHint"></div>
  <div class="banner" id="banner"></div>
  <div class="summary hidden" id="summary"></div>
  <button id="skipBtn" class="skip">모두 공개 ≫</button>
</div>

<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
